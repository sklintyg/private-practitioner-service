plugins {
    alias(libs.plugins.org.cyclonedx.bom)
    alias(libs.plugins.org.springframework.boot)
}

tasks.named('bootJar') {
    archiveFileName.set('app.jar')
}

def applicationDir = "${rootProject.projectDir}/devops/dev"

dependencies {
    implementation project(":integration-api")
    runtimeOnly project(":integration-intyg-proxy-service")

    implementation "commons-io:commons-io"
    implementation "com.google.guava:guava"
    implementation "net.javacrumbs.shedlock:shedlock-provider-redis-spring"
    implementation "net.javacrumbs.shedlock:shedlock-spring"
    implementation "org.apache.commons:commons-lang3"
    implementation "org.springframework.boot:spring-boot-starter-aspectj"
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation "org.springframework.boot:spring-boot-starter-data-redis"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-restclient"
    implementation "org.springframework.boot:spring-boot-starter-webmvc"

    runtimeOnly "com.mysql:mysql-connector-j"

    compileOnly "jakarta.persistence:jakarta.persistence-api"
    compileOnly "org.projectlombok:lombok"

    annotationProcessor "org.projectlombok:lombok"

    testCompileOnly "jakarta.persistence:jakarta.persistence-api"

    testFixturesCompileOnly "jakarta.persistence:jakarta.persistence-api"
    testFixturesCompileOnly "org.hibernate.orm:hibernate-core"

    testImplementation "org.assertj:assertj-core"
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.mockito:mockito-core"
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation "org.springframework:spring-test"

    testFixturesImplementation "org.junit.jupiter:junit-jupiter"
    testFixturesImplementation project(":integration-api")
}

bootRun {
    systemProperty("application.dir", "${applicationDir}")
    systemProperty("spring.profiles.active", "testability,dev")
    systemProperty("spring.config.additional-location", "file:${applicationDir}/config/")
}

tasks.register("appRunDebug") {
    println("######## Running in Debug mode ########")
    doFirst {
        bootRun.configure {
            jvmArgs = [
                    "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=18071"]
        }
    }
    finalizedBy("bootRun")
}

tasks.register("appRun") {
    println("######## Running in normal mode ########")
    finalizedBy("bootRun")
}